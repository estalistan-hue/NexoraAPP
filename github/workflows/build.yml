name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Expo & EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Install dependencies
        run: npm install

      - name: Login to Expo
        run: npx expo login -u YOUR_EXPO_USERNAME -p YOUR_EXPO_PASSWORD
        # OR use a token: npx expo login --token ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: npx eas build --platform android --non-interactive --output ./app.apk

      - uses: actions/upload-artifact@v3
        with:
          name: Nexora-APK
          path: app.apk
