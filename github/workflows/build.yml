name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install -g expo-cli

      - run: npm install

      - run: npx expo build:android --non-interactive

      - uses: actions/upload-artifact@v3
        with:
          name: Nexora-APK
          path: *.apk
